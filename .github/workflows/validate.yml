name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout canonical contracts
        uses: actions/checkout@v5
        with:
          path: contracts
          repository: BaudBound/contracts

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24

      - name: Install validator dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository
        run: pnpm validate

